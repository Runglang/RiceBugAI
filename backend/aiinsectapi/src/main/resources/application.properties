spring.application.name=aiinsectapi

spring.datasource.url=jdbc:mysql://localhost:3306/ai_insect_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Bangkok
spring.datasource.username=root
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

app.upload.dir=${APP_UPLOAD_DIR:uploads}

ai.api.seedling-url=http://127.0.0.1:8001
ai.api.tillering-url=http://127.0.0.1:8002
ai.api.heading-url=http://127.0.0.1:8003

#อันนี้คือเกณฑ์ confidence ขั้นต่ำ (หน่วยเป็นเปอร์เซ็นต์ 0-100) ใช้กับผลหลักและผลประกอบ
ai.confidence-threshold=70.0
